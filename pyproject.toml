[project]
name = "baseera"
version = "0.4.0"
description = "Baseera — predictability ledger and weekly list for predictive maintenance of urban assets (IECE Hackathon 2026, team T-0848)"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["dependencies"]

[project.scripts]
baseera = "baseera.cli:main"

[tool.setuptools]
packages = {find = {include = ["baseera*"]}}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
